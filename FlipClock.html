<style id="baseCss">
/* ---------- 基础 ---------- */
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
body { background: #000; color: #f2f2f2; font-family: Arial, Helvetica, "Microsoft YaHei", sans-serif; }
body.idle, body.idle * { cursor: none !important; }
/* 中心定位：left/top 定在视口中心，JS 用负 margin 把自身中心拉回，再整体 scale */
#stage { position: absolute; left: 50%; top: 50%; width: 962px; height: 332px; transform-origin: 50% 50%; text-align: center; font-size: 0; }
#clock { display: inline-block; vertical-align: top; white-space: nowrap; }
.grp { display: inline-block; vertical-align: top; white-space: nowrap; }

/* ---------- 翻页卡片（默认深色「真实翻牌」配色，其余风格由 themeCss 覆盖） ---------- */
.digit { display: inline-block; position: relative; vertical-align: top; width: 136px; height: 200px; margin-right: 10px; }
.digit.last { margin-right: 0; }
.digit.blank { width: 0; margin-right: 0; overflow: hidden; }
.digit.blank .card { visibility: hidden; }
.card { position: absolute; left: 0; width: 136px; height: 100px; overflow: hidden; text-align: center; background-color: #171717; }
.card span {
  position: absolute; left: 0; width: 136px; height: 200px; line-height: 200px;
  font-size: 150px; font-weight: 700; color: inherit; text-shadow: 0 1px 2px rgba(0,0,0,.55);
}
.card.top { top: 0; border-radius: 6px 6px 0 0; box-shadow: inset 0 -1px 0 #000, inset 0 1px 0 rgba(255,255,255,.05); }
.card.bottom { bottom: 0; border-radius: 0 0 6px 6px; box-shadow: inset 0 1px 0 #000, inset 0 -1px 0 rgba(255,255,255,.025); }
.card.top span, .card.flipTop span { top: 0; }
.card.bottom span, .card.flipBottom span { top: -100px; }
.card.flipTop { top: 0; border-radius: 6px 6px 0 0; z-index: 4; transform: scaleY(0); transform-origin: bottom center; }
.card.flipBottom { bottom: 0; border-radius: 0 0 6px 6px; z-index: 4; transform: scaleY(0); transform-origin: top center; }
.card.flipTop:after, .card.flipBottom:after { content: ""; position: absolute; left: 0; right: 0; height: 100%; background: #000; opacity: 0; pointer-events: none; }
.card.flipTop:after { top: 0; }
.card.flipBottom:after { bottom: 0; }
.digit.flipping .flipTop { animation: flipTop .28s cubic-bezier(.45,.05,.85,.55) forwards; }
.digit.flipping .flipBottom { animation: flipBottom .28s cubic-bezier(.2,.7,.3,1) .28s forwards; }
.digit.flipping .flipTop:after { animation: shadeTop .28s linear forwards; }
.digit.flipping .flipBottom:after { animation: shadeBottom .28s linear .28s forwards; }
@keyframes flipTop { from { transform: scaleY(1) scaleX(1); } to { transform: scaleY(0) scaleX(.965); } }
@keyframes flipBottom { from { transform: scaleY(0) scaleX(.965); } to { transform: scaleY(1) scaleX(1); } }
@keyframes shadeTop { from { opacity: 0; } to { opacity: .55; } }
@keyframes shadeBottom { from { opacity: .55; } to { opacity: 0; } }
/* !important：压过 animCss 里动态写入的 animation-duration */
body.no-anim .digit.flipping .flipTop, body.no-anim .digit.flipping .flipBottom,
body.no-anim .digit.flipping .flipTop:after, body.no-anim .digit.flipping .flipBottom:after { animation: none !important; }
body.reduce-motion .digit.flipping .flipTop:after,
body.reduce-motion .digit.flipping .flipBottom:after { animation: none !important; }
body.reduce-motion .card.flipTop:after, body.reduce-motion .card.flipBottom:after { display: none; }

/* ---------- 冒号 ---------- */
.sep { display: inline-block; position: relative; vertical-align: top; width: 38px; height: 200px; margin: 0 10px; }
.sep i { position: absolute; left: 13px; width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: .88; }
.sep i.first { top: 68px; }
.sep i.last { top: 122px; }

/* ---------- 布局：紧凑 / 宽屏 / 纵向 ---------- */
body.layout-compact .digit { width: 106px; height: 148px; margin-right: 6px; }
body.layout-compact .card { width: 106px; height: 74px; }
body.layout-compact .card span { width: 106px; height: 148px; line-height: 148px; font-size: 110px; }
body.layout-compact .card.bottom span, body.layout-compact .card.flipBottom span { top: -74px; }
body.layout-compact .sep { width: 24px; height: 148px; margin: 0 6px; }
body.layout-compact .sep i { left: 7px; width: 9px; height: 9px; }
body.layout-compact .sep i.first { top: 50px; }
body.layout-compact .sep i.last { top: 90px; }
body.layout-compact #subline { height: 44px; line-height: 44px; font-size: 18px; }
body.layout-compact #infobar { height: 26px; line-height: 26px; }
body.layout-compact #countdown { height: 40px; line-height: 40px; font-size: 15px; }

body.layout-wide .digit { width: 168px; height: 220px; margin-right: 16px; }
body.layout-wide .card { width: 168px; height: 110px; }
body.layout-wide .card span { width: 168px; height: 220px; line-height: 220px; font-size: 182px; }
body.layout-wide .card.bottom span, body.layout-wide .card.flipBottom span { top: -110px; }
body.layout-wide .sep { width: 48px; height: 220px; margin: 0 16px; }
body.layout-wide .sep i { left: 16px; width: 15px; height: 15px; }
body.layout-wide .sep i.first { top: 74px; }
body.layout-wide .sep i.last { top: 134px; }
body.layout-wide #subline { height: 62px; line-height: 62px; font-size: 23px; }

body.layout-vertical .grp { display: block; margin: 0 auto 16px; }
body.layout-vertical .grp.lastgrp { margin-bottom: 0; }
body.layout-vertical .sep { display: none; }
body.layout-vertical #clock { display: block; }
body.layout-vertical #subline { font-size: 19px; }

/* ---------- 副行 / 农历节日 / 倒数日 ---------- */
#subline { height: 56px; line-height: 56px; text-align: center; font-size: 21px; letter-spacing: 3px; padding-left: 3px; color: inherit; }
#subline.empty { display: none; }
#date { opacity: .38; }
#ampm { margin-right: 18px; font-size: 18px; opacity: .78; }
#ampm:empty { display: none; }
#infobar { height: 30px; line-height: 30px; text-align: center; font-size: 14px; letter-spacing: 1px; color: inherit; opacity: .62; white-space: nowrap; }
#infobar.off { display: none; }
#infobar .fest { font-weight: 700; margin-left: 14px; }
#countdown { height: 46px; line-height: 46px; text-align: center; font-size: 17px; letter-spacing: 2px; padding-left: 2px; color: inherit; opacity: .58; white-space: nowrap; }
#countdown.off { display: none; }
#cdNum { margin: 0 3px; font-size: 25px; font-weight: 700; opacity: .95; }
#cdNum:empty { display: none; }

/* ---------- 番茄钟（沉浸模式只保留时钟 + 这一条） ---------- */
#pomo { height: 120px; padding-top: 6px; text-align: center; color: inherit; }
#pomo.off { display: none; }
#pomoPhase { font-size: 14px; letter-spacing: 5px; opacity: .7; line-height: 22px; }
#pomoTime { font-size: 62px; font-weight: 700; line-height: 68px; letter-spacing: 5px; }
#pomoRound { font-size: 12px; opacity: .55; line-height: 18px; }
#pomoBtns { margin-top: 2px; }
#pomoBtns button, #pomoExit {
  background: transparent; color: inherit; border: 1px solid #555; border-radius: 5px;
  font-family: inherit; font-size: 11px; padding: 3px 10px; margin: 0 3px; cursor: pointer; opacity: .65;
}
#pomoBtns button:hover, #pomoExit:hover { opacity: 1; border-color: #aaa; }
#pomoExit { display: none; position: fixed; right: 14px; bottom: 12px; z-index: 15; opacity: .18; }
body.focus-mode #pomoExit { display: block; }
body.focus-mode #subline, body.focus-mode #infobar, body.focus-mode #countdown,
body.focus-mode #world, body.focus-mode #weather, body.focus-mode #progress,
body.focus-mode #hint, body.focus-mode #gear, body.focus-mode #panel { display: none !important; }

/* ---------- 侧栏模块：世界时钟 / 时间进度 / 天气 ---------- */
#world, #progress, #weather { position: fixed; z-index: 8; font-size: 12px; line-height: 20px; }
#world { left: 18px; bottom: 18px; width: 216px; }
#progress { right: 18px; bottom: 18px; width: 210px; text-align: right; }
#weather { left: 18px; top: 16px; min-width: 130px; }
#world.off, #progress.off, #weather.off, body.tiny #world, body.tiny #progress, body.tiny #weather { display: none; }
.wtitle, .ptitle, .wxtitle { font-size: 10px; letter-spacing: 2px; opacity: .68; margin-bottom: 4px; }
.wrow { white-space: nowrap; opacity: .94; }
.wrow .wc { display: inline-block; min-width: 66px; }
.wrow .wt { font-weight: 700; font-size: 14px; letter-spacing: 1px; }
.wrow .wz { font-size: 10px; opacity: .76; margin-left: 6px; }
.pbig { font-size: 30px; font-weight: 700; line-height: 34px; letter-spacing: 1px; }
.plbl { font-size: 10px; letter-spacing: 2px; opacity: .68; margin-bottom: 6px; }
.prow { font-size: 10px; opacity: .88; margin-top: 3px; }
.prow span { display: inline-block; width: 16px; }
.prow i { display: inline-block; width: 120px; height: 4px; background: rgba(127,127,127,.28); border-radius: 2px; vertical-align: middle; overflow: hidden; }
.prow i b { display: block; height: 100%; width: 0; background: currentColor; }
.prow em { display: inline-block; width: 38px; font-style: normal; text-align: right; }
.wxicon { font-size: 22px; vertical-align: middle; margin-right: 6px; }
.wxcity { opacity: .78; font-size: 10px; letter-spacing: 1px; }
.wxtext { font-size: 14px; }
body.pos-right #world { left: auto; right: 18px; }
body.pos-top #world { left: 50%; margin-left: -260px; top: 14px; bottom: auto; width: 520px; text-align: center; }
body.pos-top .wrow { display: inline-block; margin: 0 10px; }
body.pos-top .wrow .wc { min-width: 0; margin-right: 4px; }
@media (max-width: 860px) {
  #world, #progress { width: 154px; font-size: 10px; }
  .prow i { width: 74px; }
  #weather { font-size: 10px; }
}

/* ---------- 设置按钮与面板 ---------- */
#gear {
  position: fixed; right: 18px; top: 16px; z-index: 20; padding: 8px 14px;
  border: 1px solid #444; border-radius: 6px; background: rgba(20,20,20,.75);
  color: #ccc; font-size: 13px; font-family: inherit; cursor: pointer; opacity: 0; transition: opacity .35s;
}
#gear:hover { color: #fff; border-color: #888; }
#panel {
  position: fixed; right: 18px; top: 58px; z-index: 20; width: 306px;
  max-height: calc(100% - 76px); overflow: auto; padding: 14px 16px 16px;
  border: 1px solid #3a3a3a; border-radius: 10px; background: rgba(24,24,24,.96);
  color: #ddd; font-size: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.6);
}
#panel.hidden { display: none; }
#panel .ph { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #fff; }
#close { float: right; cursor: pointer; color: #888; font-size: 20px; line-height: 16px; }
#close:hover { color: #fff; }
#tabs { border-bottom: 1px solid #3a3a3a; margin-bottom: 10px; font-size: 0; }
#tabs button {
  width: 25%; padding: 6px 0; background: transparent; color: #888; border: 0;
  border-bottom: 2px solid transparent; font-family: inherit; font-size: 12px; cursor: pointer;
}
#tabs button.on { color: #fff; border-bottom-color: #8ab4f8; }
.pane.off { display: none; }
#panel label { display: block; margin: 8px 0; line-height: 22px; }
/* 控件 float:right 会脱离文档流，不清浮动会让下一行说明文字挤上来重叠；
   只作用于面板直属行，城市多选里的 inline-block 标签不受影响 */
#panel .pane > label { clear: both; overflow: hidden; }
#panel .fhead, #panel .fnote, #panel .rowbtn, #panel .fhtml { clear: both; overflow: hidden; }
#panel select, #panel input[type=text], #panel input[type=range] {
  float: right; width: 142px; padding: 3px 4px; background: #2b2b2b; color: #eee;
  border: 1px solid #4a4a4a; border-radius: 4px; font-family: inherit; font-size: 12px;
}
#panel input[type=range] { padding: 0; height: 20px; }
#panel input[type=checkbox] { vertical-align: -2px; margin-right: 6px; }
#panel .rv { float: none; color: #8ab4f8; font-weight: 400; margin-left: 4px; }
#panel .fhead { margin: 12px 0 4px; padding-top: 8px; border-top: 1px solid #333; color: #fff; font-weight: 700; font-size: 12px; }
#panel .fhead:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
#panel .fnote { color: #9a9a9a; font-size: 11px; line-height: 16px; margin: 6px 0; }
#panel .rowbtn, #panel .fhtml button {
  width: 100%; margin-top: 6px; padding: 6px 0; background: transparent; color: #aaa;
  border: 1px solid #444; border-radius: 5px; font-family: inherit; font-size: 11px; cursor: pointer;
}
#panel .rowbtn:hover, #panel .fhtml button:hover { color: #fff; border-color: #888; }
#panel .fhtml { margin: 4px 0; }
#cityGrid { font-size: 11px; line-height: 20px; }
#cityGrid label { display: inline-block; width: 48%; margin: 1px 0; }
#cityGrid input { vertical-align: -2px; margin-right: 4px; }
#swatches { margin-top: 6px; }
#swatches button {
  display: inline-block; width: 22px; height: 18px; margin: 0 4px 4px 0; padding: 0;
  border: 1px solid #555; border-radius: 3px; cursor: pointer; vertical-align: middle;
}
#panel .tip { margin-top: 12px; color: #999; font-size: 11px; line-height: 16px; }
#panel .credit { margin-top: 10px; padding-top: 9px; border-top: 1px solid #333; text-align: center; color: #999; font-size: 12px; letter-spacing: 1px; }
#panel .repo { margin-top: 5px; text-align: center; font-size: 11px; letter-spacing: 0; }
#panel .repo a { color: #8ab4f8; text-decoration: none; border-bottom: 1px dotted #4a6da7; }
#panel .repo a:hover { color: #b6d4ff; border-bottom-color: #8ab4f8; }

/* ---------- 首次提示 ---------- */
#hint { position: fixed; left: 0; right: 0; bottom: 34px; z-index: 10; text-align: center; color: #777; font-size: 12px; letter-spacing: 1px; transition: opacity 1s; pointer-events: none; }
#hint.gone { opacity: 0; }

/* ---------- 壳子模式 ---------- */
body.shell-mode #gear, body.shell-mode #btnFull { display: none; }
body.shell-mode.shell-note #close { display: none; }
body.shell-mode.shell-quiet #hint { display: none; }
body.shell-mode.shell-note #hint { opacity: 1; color: #8a8a8a; }
body.shell-mode.shell-note #hint.gone { opacity: 1; }
body.shell-mode.shell-note #panel { max-height: calc(100% - 110px); }
#tipShell { display: none; }
body.shell-mode #tipBrowser { display: none; }
body.shell-mode.shell-note #tipShell { display: block; }

  function fit() {

  /* 单张卡片赋值：只有字符真的变化才起动画 */
  function setChar(el, ch, force, delay) {

    if (cur === ch && !force) return false;
    if (delay > 0) {
      clearTimeout(el._delayTimer);
      el._delayTimer = setTimeout(function(){ el._delayTimer = null; setChar(el,ch,false,0); }, delay);
      return false;
    }
    if (force) { clearTimeout(el._delayTimer); el._delayTimer = null; }
    var wasBlank = hasClass(el,"blank"), isBlank = (ch === " ");
    el.setAttribute("data-char", ch);
    if (isBlank) addClass(el,"blank"); else removeClass(el,"blank");
    var sp = el.getElementsByTagName("span");
    var layoutChanged = (wasBlank !== isBlank);
    if (hasClass(el,"flipping")) { clearTimeout(el._timer); removeClass(el,"flipping"); sp[1].textContent = cur; }
    if (force || !cfg.anim) { sp[0].textContent = ch; sp[1].textContent = ch; return layoutChanged; }
    sp[0].textContent = ch; sp[1].textContent = cur;
    sp[2].textContent = cur; sp[3].textContent = ch;

      var el = digits[i], ch = text.charAt(i);

      var d = (cascade && STEP) ? order*STEP : 0;
      if (setChar(el,ch,force,d)) relayout = true;
      if (cascade && STEP) order++;

    return relayout;
  }
  function updateMain(text, force) {
    var relayout = false, order = 0, cascade = (!force && cfg.anim);
    for (var i=3;i>=0;i--) {

      var blankChange = ((ch === " ") !== hasClass(el,"blank"));
      var d = (cascade && STEP && !blankChange) ? order*STEP : 0;
      if (setChar(el,ch,force,d)) relayout = true;

  /* ---------- 时间进度 ---------- */
  function renderProgress(now) {

    toggleOff($("progress"), false);

    var dayNo = Math.round((Date.UTC(y,now.getMonth(),now.getDate()) - Date.UTC(y,0,1))/86400000);
    var v = [
      ["Day", secOfDay/86400*100],
      ["Hour", (m*60+s)/3600*100],
      ["Min", s/60*100],
      ["Year", (dayNo + secOfDay/86400)/daysY*100]
    ];
    for (var i=0;i<v.length;i++) {
      var pct = v[i][1], k = v[i][0];
      $("pb"+k).style.width = pct.toFixed(2) + "%";
      $("pt"+k).textContent = Math.floor(pct) + "%";
    }
    $("progBig").textContent = v[0][1].toFixed(1) + "%";
  }

  /* ---------- 天气：默认纯离线手填，填了接口才联网 ---------- */
  var WX_ICON = { sun:"☀", cloud:"☁", rain:"☂", snow:"❄", night:"☾" };
  function renderWeather() {
    toggleOff($("weather"), !cfg.weather);
    if (!cfg.weather) return;
    var city = (weatherLive && weatherLive.city) || cfg.weatherCity || "本地";
    var text = (weatherLive && weatherLive.text) || cfg.weatherText || "—";
    var icon = (weatherLive && weatherLive.icon) || cfg.weatherIcon;
    $("wxCity").textContent = city;
    $("wxText").textContent = text;
    $("wxIcon").textContent = WX_ICON[icon] || WX_ICON.sun;
  }
  function weatherFetch(manual) {
    var u = (cfg.weatherApi || "").replace(/^\s+|\s+$/g,"");
    if (!u) { weatherLive = null; renderWeather(); return; }
    var cbName = "flip_clock_wx_cb";
    var done = false, sc = null;
    function cleanup() { try { window[cbName] = null; } catch(e){} if (sc && sc.parentNode) sc.parentNode.removeChild(sc); }
    window[cbName] = function(data) {
      if (done || !data || typeof data !== "object") return;
      done = true;
      var icons = ["sun","cloud","rain","snow","night"];
      weatherLive = {
        city: typeof data.city === "string" ? cleanName(data.city).slice(0,16) : "",
        text: typeof data.text === "string" ? cleanName(data.text).slice(0,24) : "",
        icon: icons.indexOf(data.icon) >= 0 ? data.icon : cfg.weatherIcon
      };
      renderWeather(); cleanup();
    };
    try {
      sc = document.createElement("script");
      sc.src = u + (u.indexOf("?") >= 0 ? "&" : "?") + "callback=" + cbName + "&_=" + (new Date()).getTime();
      document.getElementsByTagName("head")[0].appendChild(sc);
    } catch (e) { cleanup(); }
    setTimeout(function(){ if (!done) { if (manual) weatherLive = null; renderWeather(); cleanup(); } }, 8000);
  }
  function scheduleWeather() {
    clearTimeout(weatherTimer);
    if (!cfg.weather || !cfg.weatherApi) return;
    weatherFetch(false);
    weatherTimer = setTimeout(scheduleWeather, clamp(cfg.weatherMins,5,240)*60000);
  }

  /* ---------- 提示音：运行时合成极短 WAV，零外部文件 ---------- */
  var toneCache = {};
  function toneUrl(kind) {
    if (toneCache[kind]) return toneCache[kind];
    var rate = 8000, ms = kind === "work" ? 420 : 300, n = Math.floor(rate*ms/1000), len = 44+n;
    var buf = new Uint8Array(len);
    function str(off, s) { for (var i=0;i<s.length;i++) buf[off+i] = s.charCodeAt(i); }
    function u32(off, v) { buf[off]=v&255; buf[off+1]=(v>>8)&255; buf[off+2]=(v>>16)&255; buf[off+3]=(v>>24)&255; }
    function u16(off, v) { buf[off]=v&255; buf[off+1]=(v>>8)&255; }
    str(0,"RIFF"); u32(4,len-8); str(8,"WAVEfmt "); u32(16,16); u16(20,1); u16(22,1);
    u32(24,rate); u32(28,rate); u16(32,1); u16(34,8); str(36,"data"); u32(40,n);
    var f1 = kind === "work" ? 880 : 660, f2 = kind === "work" ? 1174 : 880;
    for (var i=0;i<n;i++) {
      var t = i/rate, env = Math.exp(-6*t/(ms/1000));
      var v = Math.sin(2*Math.PI*f1*t)*0.62 + Math.sin(2*Math.PI*f2*t)*0.28;
      buf[44+i] = clamp(Math.round(128 + v*env*100), 0, 255);
    }
    var s = ""; for (i=0;i<len;i++) s += String.fromCharCode(buf[i]);
    var url = "data:audio/wav;base64," + (window.btoa ? btoa(s) : "");
    toneCache[kind] = url; return url;
  }
  function playChime(kind, count) {
    try {
      var url = toneUrl(kind); if (!url) return;
      var i = 0;
      function one() {
        if (i++ >= count) return;
        try { var a = new Audio(url); a.volume = 0.35; a.play(); } catch (e) {}
        if (i < count) setTimeout(one, 340);
      }
      one();
    } catch (e) {}
  }
  function maybeChime(now, force) {
    if (cfg.chime === "off" || force) return;
    var s = now.getSeconds(), m = now.getMinutes();
    if (s !== 0 || (m !== 0 && m !== 30)) return;
    if ((m === 0 && cfg.chime === "half") || (m === 30 && cfg.chime === "hour")) return;
    var key = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(now.getHours())+":"+pad(m);
    if (key === lastChimeKey) return;
    lastChimeKey = key;
    playChime(m === 0 ? "hour" : "half", m === 0 ? 2 : 1);
  }

  /* ---------- 番茄钟：绝对结束时间戳，休眠/刷新都不跑偏 ---------- */
  function phaseMinutes(ph) {
    return ph === "work" ? cfg.pomoWork : (ph === "break" ? cfg.pomoBreak : cfg.pomoLong);
  }
  function pomoStart(ph, round) {
    cfg.pomoState = { ph:ph, round:round, endAt:(new Date()).getTime() + phaseMinutes(ph)*60000, remain:0, paused:false };
    saveCfg(); pomoRender(true);
  }
  function pomoReset() {
    if (cfg.pomo) pomoStart("work", 1); else { cfg.pomoState = null; saveCfg(); pomoRender(true); }
  }
  function pomoRemaining() {
    var st = cfg.pomoState; if (!st) return 0;
    return st.paused ? st.remain : Math.max(0, st.endAt - (new Date()).getTime());
  }
  function pomoAdvance() {
    var st = cfg.pomoState; if (!st) return;
    var next, round = st.round;
    if (st.ph === "work") { next = (st.round % cfg.pomoRounds === 0) ? "long" : "break"; }
    else { next = "work"; round = st.ph === "long" ? 1 : st.round + 1; }
    if (cfg.pomoSound) playChime(next === "work" ? "work" : "break", 2);
    pomoStart(next, round);
    if (!cfg.pomoAuto) {
      cfg.pomoState.paused = true;
      cfg.pomoState.remain = phaseMinutes(next)*60000;
      cfg.pomoState.endAt = 0; saveCfg();
    }
  }
  function pomoTick() {
    var st = cfg.pomoState;
    if (!cfg.pomo) { if (st && st.ph !== "work") { /* 退出专注不清状态 */ } return; }
    if (!st) { pomoStart("work",1); return; }
    if (!st.paused && pomoRemaining() <= 0) pomoAdvance();
    pomoRender(false);
  }
  function pomoRender(force) {
    if (!cfg.pomo) { toggleOff($("pomo"), true); return; }
    toggleOff($("pomo"), false);
    var st = cfg.pomoState; if (!st) return;
    var name = st.ph === "work" ? "专注" : (st.ph === "break" ? "短休" : "长休");
    var ms = pomoRemaining(), total = Math.ceil(ms/1000);
    var txt = pad(Math.floor(total/60)) + ":" + pad(total%60);
    if ($("pomoTime").textContent !== txt) $("pomoTime").textContent = txt;
    var ph = name + (st.paused ? " · 已暂停" : "");
    if ($("pomoPhase").textContent !== ph) $("pomoPhase").textContent = ph;
    var rnd = "第 " + st.round + " / " + cfg.pomoRounds + " 轮";
    if ($("pomoRound").textContent !== rnd) $("pomoRound").textContent = rnd;
    $("pomoPause").textContent = st.paused ? "继续" : "暂停";
  }
  function pomoTogglePause() {
    var st = cfg.pomoState; if (!st) return;
    if (st.paused) { st.endAt = (new Date()).getTime() + st.remain; st.paused = false; st.remain = 0; }
    else { st.remain = pomoRemaining(); st.paused = true; st.endAt = 0; }
    saveCfg(); pomoRender(true);
  }

  /* ---------- 走时：一切以 new Date() 为准 ---------- */
  function renderAll(now, force) {
    syncCountdown(); renderCountdown(now); renderInfo(now);
    renderWorld(now, force); renderProgress(now); renderWeather(); pomoRender(force);
  }
  function tick(force) {
    var now = new Date(), wall = now.getTime();
    /* 后台节流 / 系统休眠后跳帧：直接按真实时间重画，不补播动画 */
    var gap = lastWall ? wall - lastWall : 0;
    lastWall = wall;
    if (gap > 2500) force = true;

    var tone = toneNow();
    if (tone !== lastTone) { applyTheme(); applyFlagsToneOnly(tone); }

    var h = now.getHours(), m = now.getMinutes(), s = now.getSeconds(), ap = "";
    if (cfg.hour === "12") { ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; }
    var text = pad(h) + pad(m) + (cfg.sec ? pad(s) : "");
    if (cfg.hour === "12" && h < 10) text = " " + text.slice(1);

    var minKey = now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate())+" "+pad(h)+":"+pad(m);
    var dayKey = minKey.slice(0,10);
    var relayout = false;
    /* 秒与时分彻底分开：每秒只更新秒位；分钟变化才更新时 / 分位 */
    if (s !== lastSec || force) { if (updateSeconds(text,force)) relayout = true; lastSec = s; }
    if (minKey !== lastMinKey || force) {
      if (updateMain(text,force)) relayout = true;
      if ($("ampm").textContent !== ap) $("ampm").textContent = ap;
      var dstr = cfg.date
        ? now.getFullYear()+"年"+(now.getMonth()+1)+"月"+now.getDate()+"日　·　星期"+WEEK[now.getDay()] : "";
      if ($("date").textContent !== dstr) $("date").textContent = dstr;
      var want = (cfg.date || ap) ? "" : "empty";
      if ($("subline").className !== want) $("subline").className = want;
      renderInfo(now);
      renderWorld(now, true);
      lastMinKey = minKey;
    }
    if (dayKey !== lastDayKey || force) { renderCountdown(now); lastDayKey = dayKey; }
    if (relayout || force) fit();

    if (cfg.worldSec) renderWorld(now, false);
    renderProgress(now);
    pomoTick();
    maybeChime(now, force);
    return now;
  }
  function applyFlagsToneOnly(tone) {
    var b = document.body;
    removeClass(b, tone === "light" ? "theme-dark" : "theme-light");
    addClass(b, tone === "light" ? "theme-light" : "theme-dark");
  }
  function schedule() {
    var delay = 1000 - (new Date()).getTime() % 1000 + 8;
    setTimeout(function(){ tick(false); schedule(); }, delay);
  }
  function calibrate() { lastWall = 0; tick(true); }

  /* ---------- 全量刷新 ---------- */
  function reconcile(changed) {
    applyAnim(); applyTheme(); applyFlags();
    if (changed === "hour" || changed === "sec" || changed === "layout" || changed === "anim") build();
    if (changed === "weather") scheduleWeather();
    renderWeather();
    if (changed === "pomo") { if (cfg.pomo && !cfg.pomoState) pomoStart("work",1); else pomoRender(true); }
    if (changed === "pomoWork" || changed === "pomoBreak" || changed === "pomoLong" || changed === "pomoRounds") pomoReset();
    fit();
    tick(true);
  }
  function refreshAll() { applyAnim(); applyTheme(); applyFlags(); build(); tick(true); }

  /* ---------- 设置面板 / 快捷键 / 全屏 ---------- */
  function showPanel() {
    removeClass($("panel"),"hidden"); removeClass(document.body,"idle");
    $("gear").style.opacity = "1"; isIdle = false; clearTimeout(idleTimer);
  }
  function hidePanel() { addClass($("panel"),"hidden"); poke(); }
  function togglePanel() { hasClass($("panel"),"hidden") ? showPanel() : hidePanel(); }
  function exitFocus() {
    if (!cfg.pomo) return;
    cfg.pomo = false; saveCfg(); applyFlags(); fit(); tick(true);
  }
  $("close").onclick = hidePanel;
  $("gear").onclick = togglePanel;
  $("projLink").onclick = function() {
    if (!hasClass(document.body,"shell-mode")) return true;
    try { window.external.OpenProject(PROJECT_URL); } catch (e) {}
    return false;
  };
  $("pomoExit").onclick = exitFocus;
  $("pomoPause").onclick = pomoTogglePause;
  $("pomoSkip").onclick = function(){ pomoAdvance(); };
  $("pomoReset").onclick = pomoReset;

  var fsGuardUntil = 0, lastX = -1, lastY = -1;
  function inFullscreen() {
    return !!(document.fullscreenElement || document.msFullscreenElement || document.webkitFullscreenElement);
  }
  function fullscreen() {
    var d = document.documentElement;
    try {
      if (d.requestFullscreen) d.requestFullscreen();
      else if (d.msRequestFullscreen) d.msRequestFullscreen();
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    } catch (e) {}
  }
  function leaveFullscreen() {
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) {}
    lastX = lastY = -1;
  }
  function onFsActivity() {
    if (!inFullscreen()) return;
    if ((new Date()).getTime() < fsGuardUntil) return;
    if (!hasClass($("panel"),"hidden")) return;
    leaveFullscreen();
  }
  function onFsChange() {
    fsGuardUntil = (new Date()).getTime() + 700; lastX = lastY = -1;
    if (inFullscreen()) {
      clearTimeout(idleTimer); addClass(document.body,"idle"); $("gear").style.opacity = "0"; isIdle = true;
    } else poke();
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("msfullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  var idleTimer = null, isIdle = false;
  function poke() {
    if (hasClass(document.body,"shell-mode")) return;
    if (!hasClass($("panel"),"hidden")) return;
    if (isIdle) { removeClass(document.body,"idle"); isIdle = false; }
    if ($("gear").style.opacity !== "1") $("gear").style.opacity = "1";
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function(){ addClass(document.body,"idle"); $("gear").style.opacity = "0"; isIdle = true; }, 3000);
  }
  document.onmousemove = function(e) {
    e = e || window.event; poke();
    if (!inFullscreen() || (new Date()).getTime() < fsGuardUntil) { lastX = lastY = -1; return; }
    var x = e.clientX, y = e.clientY;
    if (lastX < 0) { lastX = x; lastY = y; return; }
    if (Math.abs(x-lastX) > 10 || Math.abs(y-lastY) > 10) onFsActivity();
    lastX = x; lastY = y;
  };
  document.onmousedown = function(e) {
    e = e || window.event; poke();
    var t = e.target || e.srcElement;
    if (t === $("gear") || ($("panel").contains && $("panel").contains(t))) return;
    onFsActivity();
  };
  var resizeTimer = null;
  function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(fit, 80); }
  window.onresize = onResize; window.onorientationchange = onResize;
  document.onkeydown = function(e) {
    e = e || window.event;
    var k = e.keyCode || e.which;
    if (hasClass(document.body,"shell-mode")) return;
    if (isFormTarget(e.target || e.srcElement) && k !== 27) { poke(); return; }
    if (k === 83) togglePanel();                         // S 设置
    else if (k === 70) fullscreen();                     // F 全屏
    else if (k === 80) { cfg.pomo = !cfg.pomo; saveCfg(); applyFlags(); fit(); tick(true); }  // P 专注
    else if (k === 32 && cfg.pomo) { pomoTogglePause(); }  // 空格 暂停/继续
    else if (k === 84) { cfg.themeMode = (toneNow() === "light") ? "dark" : "light"; saveCfg(); applyCfgToPanel(); applyTheme(); applyFlags(); } // T 明暗
    else if (k === 76) { cfg.layout = LAYOUTS[(LAYOUTS.indexOf(cfg.layout)+1)%4]; saveCfg(); applyCfgToPanel(); build(); fit(); tick(true); } // L 布局
    else if (k === 27) { if (cfg.pomo) exitFocus(); else hidePanel(); }
    else onFsActivity();
    applyCfgToPanel();
    poke();
  };

  /* ---------- 供 .scr 壳子在 DocumentCompleted 里调用 ---------- */
  window.ApplyShellMode = function(mode) {
    addClass(document.body,"shell-mode");
    if (mode === "c") {
      removeClass(document.body,"shell-quiet"); addClass(document.body,"shell-note");
      var hint = $("hint"); hint.style.display = ""; hint.className = "";
      hint.textContent = "改动自动保存并立即生效 · 关闭本窗口返回屏保设置";
      showPanel();
    } else {
      removeClass(document.body,"shell-note"); addClass(document.body,"shell-quiet");
      addClass($("panel"),"hidden"); $("hint").style.display = "none";
      removeClass(document.body,"tiny");
      if (mode === "p") addClass(document.body,"tiny");
    }
    fit();
  };

  /* ---------- 启动 ---------- */
  loadCfg();
  buildPanel();
  applyCfgToPanel();
  applyAnim(); applyTheme(); applyFlags();
  build();
  tick(true);
  schedule();
  scheduleWeather();
  renderWeather();
  poke();
  var seen = false;
  try { seen = localStorage.getItem(HINT_KEY) === "1"; } catch (e) {}
  if (seen) addClass($("hint"),"gone");
  else {
    try { localStorage.setItem(HINT_KEY,"1"); } catch (e) {}
    setTimeout(function(){ addClass($("hint"),"gone"); }, 5000);
  }
  function keepAwake() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        var p = navigator.wakeLock.request("screen");
        if (p && p.catch) p.catch(function(){});
      }
    } catch (e) {}
  }
  keepAwake();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) { keepAwake(); calibrate(); } });
  window.addEventListener("pageshow", calibrate);
  window.addEventListener("focus", calibrate);

  /* 只读自检入口：离线核对历法、时区与配置白名单；不改动任何状态、不联网。
     验收测试接口：驱动真实函数，不改变产品行为，仅用于离线自动化验收。 */
  window.FlipClockSelfTest = {
    cityOffset: cityOffset, inDst: inDst, solarToLunar: solarToLunar,
    lunarText: lunarText, festivalText: festivalText, toneNow: toneNow,
    sanitize: sanitize, cfg: function(){ return cfg; },
    tick: tick, calibrate: calibrate, reconcile: reconcile, build: build, fit: fit,
    applyTheme: applyTheme, applyFlags: applyFlags, applyAnim: applyAnim, refreshAll: refreshAll,
    renderAll: renderAll, renderWorld: renderWorld, renderInfo: renderInfo,
    renderProgress: renderProgress, renderCountdown: renderCountdown, renderWeather: renderWeather,
    maybeChime: maybeChime, playChime: playChime,
    pomoStart: pomoStart, pomoAdvance: pomoAdvance, pomoReset: pomoReset,
    pomoTogglePause: pomoTogglePause, pomoRemaining: pomoRemaining,
    loadCfg: loadCfg, saveCfg: saveCfg,
    applyCfg: function(p, changed) {
      for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) cfg[k] = p[k];
      cfg = sanitize(cfg); saveCfg();
      if (changed === undefined || changed === "*") { applyAnim(); applyTheme(); applyFlags(); build(); tick(true); }
      else reconcile(changed);
    },
    digitState: function() {
      var r = [];
      for (var i = 0; i < digits.length; i++)
        r.push({ ch: digits[i].getAttribute("data-char"), flipping: hasClass(digits[i], "flipping") });
      return r;
    },
    chimeKey: function() { return lastChimeKey; }
  };
})();
</script>
</body>
